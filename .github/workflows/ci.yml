name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-repository:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check service principal script syntax
        run: |
          python -m compileall scripts

      - name: Check required folders exist
        run: |
          test -d notebooks
          test -d docs
          test -d sql
          test -d data_samples
          test -d scripts
          test -d cli_outputs

      - name: Check key project files exist
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/data_quality_rules.md
          test -f docs/ml_modeling_plan.md
          test -f docs/genai_rag_architecture.md
          test -f docs/governance_design.md
          test -f docs/BRANCHING.md
          test -f sql/governance_catalog_setup.sql
          test -f sql/governance_grants.sql
          test -f scripts/create_service_principal.py
